databases:
  - name: mankhul-db
    databaseName: mankhul_shortages
    user: mankhul
    plan: free

services:
  - type: web
    name: mankhul-shortages
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mankhul-db
          property: connectionString
